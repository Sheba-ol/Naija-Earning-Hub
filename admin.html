<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel – NaijaEarn</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root { --green:#00c853; --gold:#ffca28; --dark:#0a0a0a; --card:#141414; --border:#222; --text:#f0f0f0; --muted:#888; --red:#ff5252; --purple:#9c27b0; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--dark); color:var(--text); font-family:'DM Sans',sans-serif; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; border-bottom:1px solid var(--border); background:rgba(10,10,10,0.97); }
    .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.3rem; color:var(--text); }
    .logo span { color:var(--red); }
    .admin-badge { background:rgba(255,82,82,0.15); color:var(--red); border:1px solid rgba(255,82,82,0.3); border-radius:6px; padding:.3rem .8rem; font-size:.8rem; }
    .wrapper { max-width:1000px; margin:0 auto; padding:2rem 1.2rem; }
    h2 { font-family:'Syne',sans-serif; font-size:1.5rem; font-weight:800; margin-bottom:1.5rem; }
    /* GATE */
    #authGate { min-height:80vh; display:flex; align-items:center; justify-content:center; }
    .gate-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:2.5rem; max-width:380px; width:100%; text-align:center; }
    .gate-card h2 { margin-bottom:.5rem; }
    .gate-card p { color:var(--muted); font-size:.88rem; margin-bottom:1.5rem; }
    input { width:100%; background:#1a1a1a; border:1px solid var(--border); border-radius:8px; padding:.8rem 1rem; color:var(--text); font-family:'DM Sans',sans-serif; font-size:.9rem; outline:none; margin-bottom:1rem; transition:border-color .2s; }
    input:focus { border-color:var(--red); }
    .btn-red { width:100%; padding:.85rem; background:var(--red); color:#fff; font-family:'Syne',sans-serif; font-weight:700; font-size:.95rem; border:none; border-radius:10px; cursor:pointer; transition:all .2s; }
    .btn-red:hover { background:#ff1744; }
    /* STATS */
    .stat-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:1rem; margin-bottom:2rem; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.2rem; }
    .stat-card .lbl { font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.4rem; }
    .stat-card .val { font-family:'Syne',sans-serif; font-size:1.7rem; font-weight:800; }
    .val.green { color:var(--green); }
    .val.gold { color:var(--gold); }
    .val.red { color:var(--red); }
    /* TABLES */
    .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.5rem; margin-bottom:2rem; }
    .section h3 { font-family:'Syne',sans-serif; font-size:1.1rem; margin-bottom:1.2rem; display:flex; justify-content:space-between; align-items:center; }
    table { width:100%; border-collapse:collapse; font-size:.85rem; }
    th { text-align:left; padding:.6rem .8rem; color:var(--muted); font-weight:500; font-size:.78rem; text-transform:uppercase; border-bottom:1px solid var(--border); }
    td { padding:.75rem .8rem; border-bottom:1px solid rgba(34,34,34,0.5); }
    tr:last-child td { border-bottom:none; }
    .badge { display:inline-block; padding:.2rem .6rem; border-radius:50px; font-size:.72rem; font-weight:600; }
    .badge.pending { background:rgba(255,202,40,0.15); color:var(--gold); }
    .badge.paid { background:rgba(0,200,83,0.15); color:var(--green); }
    .badge.rejected { background:rgba(255,82,82,0.15); color:var(--red); }
    .action-btn { padding:.3rem .8rem; border-radius:6px; border:none; cursor:pointer; font-size:.78rem; font-weight:600; transition:all .2s; margin-right:.3rem; font-family:'DM Sans',sans-serif; }
    .approve { background:rgba(0,200,83,0.15); color:var(--green); border:1px solid rgba(0,200,83,0.3); }
    .approve:hover { background:var(--green); color:#000; }
    .reject { background:rgba(255,82,82,0.12); color:var(--red); border:1px solid rgba(255,82,82,0.25); }
    .reject:hover { background:var(--red); color:#fff; }
    .empty { text-align:center; color:var(--muted); padding:2rem; font-size:.88rem; }
    .alert { padding:.7rem 1rem; border-radius:8px; font-size:.85rem; margin-bottom:1rem; display:none; }
    .alert.success { background:rgba(0,200,83,0.15); color:var(--green); border:1px solid rgba(0,200,83,0.3); }
    .alert.error { background:rgba(255,82,82,0.12); color:var(--red); border:1px solid rgba(255,82,82,0.25); }
    .logout-btn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:.4rem .9rem; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.82rem; }
    .logout-btn:hover { border-color:var(--red); color:var(--red); }
  </style>
</head>
<body>

<!-- AUTH GATE -->
<div id="authGate">
  <div class="gate-card">
    <h2>Admin Access</h2>
    <p>Enter your admin credentials to continue</p>
    <input type="email" id="adminEmail" placeholder="Admin email"/>
    <input type="password" id="adminPass" placeholder="Password"/>
    <button class="btn-red" onclick="adminLogin()">Enter Admin Panel</button>
    <div class="alert" id="gateAlert"></div>
  </div>
</div>

<!-- DASHBOARD (hidden until auth) -->
<div id="adminPanel" style="display:none">
  <nav>
    <div class="logo">Naija<span>Earn</span> Admin</div>
    <div style="display:flex;gap:.8rem;align-items:center">
      <div class="admin-badge">🔒 Admin</div>
      <button class="logout-btn" onclick="adminLogout()">Log Out</button>
    </div>
  </nav>

  <div class="wrapper">
    <h2>Admin Dashboard</h2>
    <div class="alert" id="mainAlert"></div>

    <!-- STATS -->
    <div class="stat-row">
      <div class="stat-card"><div class="lbl">Total Users</div><div class="val green" id="totalUsers">—</div></div>
      <div class="stat-card"><div class="lbl">Total Paid</div><div class="val gold" id="totalPaid">—</div></div>
      <div class="stat-card"><div class="lbl">Pending Payouts</div><div class="val red" id="pendingCount">—</div></div>
      <div class="stat-card"><div class="lbl">Today's Signups</div><div class="val" id="todaySignups">—</div></div>
    </div>

    <!-- PENDING WITHDRAWALS -->
    <div class="section">
      <h3>💳 Pending Withdrawals <span id="pendingBadge" style="background:rgba(255,202,40,0.15);color:var(--gold);padding:.2rem .7rem;border-radius:50px;font-size:.75rem;font-family:'DM Sans'"></span></h3>
      <div id="withdrawalList"><div class="empty">Loading…</div></div>
    </div>

    <!-- RECENT USERS -->
    <div class="section">
      <h3>👥 Recent Users</h3>
      <div id="userList"><div class="empty">Loading…</div></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  // ⚠️ Set your admin email in firebase-config.js: window.ADMIN_EMAIL
  // OR hardcode here:
  const ADMIN_EMAIL = window.ADMIN_EMAIL || "admin@naijaearn.com";

  function showGateAlert(msg, type) {
    const el = document.getElementById("gateAlert");
    el.textContent = msg;
    el.className = "alert " + type;
    el.style.display = "block";
  }

  function showMainAlert(msg, type) {
    const el = document.getElementById("mainAlert");
    el.textContent = msg;
    el.className = "alert " + type;
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 4000);
  }

  async function adminLogin() {
    const email = document.getElementById("adminEmail").value.trim();
    const pass = document.getElementById("adminPass").value;
    if (!email || !pass) return showGateAlert("Fill all fields.", "error");
    if (email !== ADMIN_EMAIL) return showGateAlert("Not an admin account.", "error");
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      document.getElementById("authGate").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      loadAdminData();
    } catch (e) {
      showGateAlert(e.message, "error");
    }
  }

  function adminLogout() {
    auth.signOut().then(() => location.reload());
  }

  async function loadAdminData() {
    // Stats
    const usersSnap = await db.collection("users").get();
    document.getElementById("totalUsers").textContent = usersSnap.size;

    const today = new Date(); today.setHours(0,0,0,0);
    let todayCount = 0;
    usersSnap.forEach(d => {
      const joined = d.data().joinedAt?.toDate();
      if (joined && joined >= today) todayCount++;
    });
    document.getElementById("todaySignups").textContent = todayCount;

    // Pending withdrawals
    const wSnap = await db.collection("withdrawals").where("status","==","pending").orderBy("createdAt","desc").get();
    document.getElementById("pendingCount").textContent = wSnap.size;
    document.getElementById("pendingBadge").textContent = wSnap.size + " pending";

    if (wSnap.empty) {
      document.getElementById("withdrawalList").innerHTML = '<div class="empty">No pending withdrawals 🎉</div>';
    } else {
      let html = '<table><thead><tr><th>User</th><th>Bank</th><th>Account</th><th>Amount</th><th>Date</th><th>Action</th></tr></thead><tbody>';
      let totalPending = 0;
      wSnap.forEach(doc => {
        const d = doc.data();
        totalPending += d.amount;
        const date = d.createdAt?.toDate().toLocaleDateString("en-NG") || "—";
        html += `<tr>
          <td><strong>${d.username}</strong><br/><span style="color:var(--muted);font-size:.75rem">${d.fullname}</span></td>
          <td>${d.bank}</td>
          <td>${d.acc}<br/><span style="color:var(--muted);font-size:.75rem">${d.name}</span></td>
          <td style="color:var(--gold);font-weight:700">₦${d.amount.toLocaleString()}</td>
          <td style="color:var(--muted)">${date}</td>
          <td>
            <button class="action-btn approve" onclick="approveWithdrawal('${doc.id}','${d.uid}',${d.amount})">✓ Approve</button>
            <button class="action-btn reject" onclick="rejectWithdrawal('${doc.id}','${d.uid}',${d.amount})">✗ Reject</button>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById("withdrawalList").innerHTML = html;
      document.getElementById("totalPaid").textContent = "₦" + totalPending.toLocaleString();
    }

    // Recent users
    const recentSnap = await db.collection("users").orderBy("joinedAt","desc").limit(20).get();
    if (recentSnap.empty) {
      document.getElementById("userList").innerHTML = '<div class="empty">No users yet.</div>';
    } else {
      let html = '<table><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Balance</th><th>Referrals</th><th>Joined</th></tr></thead><tbody>';
      recentSnap.forEach(doc => {
        const d = doc.data();
        const date = d.joinedAt?.toDate().toLocaleDateString("en-NG") || "—";
        html += `<tr>
          <td>${d.fullname}</td>
          <td style="color:var(--green)">@${d.username}</td>
          <td style="color:var(--muted);font-size:.8rem">${d.email}</td>
          <td style="color:var(--gold);font-weight:600">₦${(d.balance||0).toLocaleString()}</td>
          <td>${d.referralCount||0}</td>
          <td style="color:var(--muted)">${date}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById("userList").innerHTML = html;
    }
  }

  async function approveWithdrawal(wId, uid, amount) {
    if (!confirm(`Approve ₦${amount.toLocaleString()} withdrawal? Make sure you've paid them first.`)) return;
    try {
      const batch = db.batch();
      batch.update(db.collection("withdrawals").doc(wId), { status: "paid", paidAt: firebase.firestore.FieldValue.serverTimestamp() });
      batch.update(db.collection("users").doc(uid), {
        pendingWithdrawal: firebase.firestore.FieldValue.increment(-amount)
      });
      // Update tx status
      const txSnap = await db.collection("transactions").where("uid","==",uid).where("type","==","withdrawal").where("status","==","pending").orderBy("createdAt","desc").limit(1).get();
      if (!txSnap.empty) batch.update(txSnap.docs[0].ref, { status: "paid" });
      await batch.commit();
      showMainAlert(`✅ Withdrawal approved and marked as paid.`, "success");
      loadAdminData();
    } catch (e) {
      showMainAlert("Error: " + e.message, "error");
    }
  }

  async function rejectWithdrawal(wId, uid, amount) {
    if (!confirm(`Reject this withdrawal and refund ₦${amount.toLocaleString()} to user?`)) return;
    try {
      const batch = db.batch();
      batch.update(db.collection("withdrawals").doc(wId), { status: "rejected" });
      batch.update(db.collection("users").doc(uid), {
        balance: firebase.firestore.FieldValue.increment(amount),
        pendingWithdrawal: firebase.firestore.FieldValue.increment(-amount)
      });
      const txSnap = await db.collection("transactions").where("uid","==",uid).where("type","==","withdrawal").where("status","==","pending").orderBy("createdAt","desc").limit(1).get();
      if (!txSnap.empty) batch.update(txSnap.docs[0].ref, { status: "rejected" });
      await batch.commit();
      showMainAlert("Withdrawal rejected and ₦" + amount.toLocaleString() + " refunded.", "success");
      loadAdminData();
    } catch (e) {
      showMainAlert("Error: " + e.message, "error");
    }
  }
</script>
</body>
</html>
