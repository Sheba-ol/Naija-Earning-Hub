<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – NaijaEarn</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root { --green:#00c853; --dark:#0a0a0a; --card:#141414; --border:#222; --text:#f0f0f0; --muted:#888; --red:#ff5252; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--dark); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:1.2rem 2rem; border-bottom:1px solid var(--border); }
    .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; text-decoration:none; color:var(--text); }
    .logo span { color:var(--green); }
    .main { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:2.5rem 2rem; width:100%; max-width:400px; }
    h2 { font-family:'Syne',sans-serif; font-size:1.7rem; font-weight:800; margin-bottom:.4rem; }
    .sub { color:var(--muted); font-size:.9rem; margin-bottom:2rem; }
    label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.4rem; margin-top:1.2rem; }
    input { width:100%; background:#1a1a1a; border:1px solid var(--border); border-radius:10px; padding:.8rem 1rem; color:var(--text); font-family:'DM Sans',sans-serif; font-size:.95rem; outline:none; transition:border-color .2s; }
    input:focus { border-color:var(--green); }
    .forgot { display:block; text-align:right; font-size:.82rem; color:var(--muted); text-decoration:none; margin-top:.5rem; }
    .forgot:hover { color:var(--green); }
    .btn { width:100%; margin-top:1.8rem; padding:.9rem; background:var(--green); color:#000; font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; border:none; border-radius:10px; cursor:pointer; transition:all .2s; }
    .btn:hover { background:#00e060; transform:translateY(-1px); }
    .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .msg { margin-top:1rem; padding:.8rem 1rem; border-radius:8px; font-size:.88rem; text-align:center; display:none; }
    .msg.success { background:rgba(0,200,83,0.15); color:var(--green); border:1px solid rgba(0,200,83,0.3); }
    .msg.error { background:rgba(255,82,82,0.12); color:var(--red); border:1px solid rgba(255,82,82,0.25); }
    .switch { text-align:center; font-size:.88rem; color:var(--muted); margin-top:1.5rem; }
    .switch a { color:var(--green); text-decoration:none; font-weight:500; }
    .spinner { display:none; width:18px; height:18px; border:2px solid rgba(0,0,0,0.3); border-top-color:#000; border-radius:50%; animation:spin .6s linear infinite; margin:0 auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">Naija<span>Earn</span></a>
  <a href="register.html" style="color:var(--muted);text-decoration:none;font-size:.9rem;">Register →</a>
</nav>

<div class="main">
  <div class="card">
    <h2>Welcome Back 👋</h2>
    <p class="sub">Log in to your NaijaEarn account</p>

    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>

    <label>Password</label>
    <input type="password" id="password" placeholder="Your password"/>
    <a href="reset.html" class="forgot">Forgot password?</a>

    <button class="btn" id="loginBtn" onclick="loginUser()">
      <span id="btnText">Log In</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="msg" id="msg"></div>

    <div class="switch">Don't have an account? <a href="register.html">Join Free</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  // Already logged in? Redirect
  auth.onAuthStateChanged(user => {
    if (user) window.location.href = "dashboard.html";
  });

  function showMsg(text, type) {
    const el = document.getElementById("msg");
    el.textContent = text;
    el.className = "msg " + type;
    el.style.display = "block";
  }

  function setLoading(loading) {
    const btn = document.getElementById("loginBtn");
    document.getElementById("btnText").style.display = loading ? "none" : "block";
    document.getElementById("spinner").style.display = loading ? "block" : "none";
    btn.disabled = loading;
  }

  async function loginUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) return showMsg("Please fill in all fields.", "error");

    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email, password);
      showMsg("Login successful! Redirecting…", "success");
      setTimeout(() => window.location.href = "dashboard.html", 1000);
    } catch (err) {
      setLoading(false);
      const msgs = {
        "auth/user-not-found": "No account found with this email.",
        "auth/wrong-password": "Incorrect password. Try again.",
        "auth/invalid-email": "Invalid email address.",
        "auth/too-many-requests": "Too many attempts. Please wait a moment."
      };
      showMsg(msgs[err.code] || "Login failed. Please try again.", "error");
    }
  }

  // Allow Enter key
  document.addEventListener("keypress", e => {
    if (e.key === "Enter") loginUser();
  });
</script>
</body>
</html>
