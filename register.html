<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – NaijaEarn</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root { --green:#00c853; --gold:#ffca28; --dark:#0a0a0a; --card:#141414; --border:#222; --text:#f0f0f0; --muted:#888; --red:#ff5252; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--dark); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:1.2rem 2rem; border-bottom:1px solid var(--border); }
    .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; text-decoration:none; color:var(--text); }
    .logo span { color:var(--green); }
    .main { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1rem; }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:20px;
      padding:2.5rem 2rem; width:100%; max-width:420px;
    }
    h2 { font-family:'Syne',sans-serif; font-size:1.7rem; font-weight:800; margin-bottom:.4rem; }
    .sub { color:var(--muted); font-size:.9rem; margin-bottom:2rem; }
    .ref-badge {
      background:rgba(0,200,83,0.12); border:1px solid rgba(0,200,83,0.25);
      border-radius:8px; padding:.7rem 1rem; font-size:.85rem; color:var(--green);
      margin-bottom:1.5rem; display:none;
    }
    label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.4rem; margin-top:1.2rem; }
    input {
      width:100%; background:#1a1a1a; border:1px solid var(--border); border-radius:10px;
      padding:.8rem 1rem; color:var(--text); font-family:'DM Sans',sans-serif; font-size:.95rem;
      outline:none; transition:border-color .2s;
    }
    input:focus { border-color:var(--green); }
    .btn {
      width:100%; margin-top:1.8rem; padding:.9rem; background:var(--green); color:#000;
      font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; border:none;
      border-radius:10px; cursor:pointer; transition:all .2s;
    }
    .btn:hover { background:#00e060; transform:translateY(-1px); }
    .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .msg { margin-top:1rem; padding:.8rem 1rem; border-radius:8px; font-size:.88rem; text-align:center; display:none; }
    .msg.success { background:rgba(0,200,83,0.15); color:var(--green); border:1px solid rgba(0,200,83,0.3); }
    .msg.error { background:rgba(255,82,82,0.12); color:var(--red); border:1px solid rgba(255,82,82,0.25); }
    .divider { display:flex; align-items:center; gap:1rem; margin:1.5rem 0; color:var(--muted); font-size:.8rem; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .switch { text-align:center; font-size:.88rem; color:var(--muted); margin-top:1.2rem; }
    .switch a { color:var(--green); text-decoration:none; font-weight:500; }
    .terms { font-size:.78rem; color:var(--muted); text-align:center; margin-top:1rem; line-height:1.5; }
    .terms a { color:var(--muted); }
    .spinner { display:none; width:18px; height:18px; border:2px solid rgba(0,0,0,0.3); border-top-color:#000; border-radius:50%; animation:spin .6s linear infinite; margin:0 auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">Naija<span>Earn</span></a>
  <a href="login.html" style="color:var(--muted);text-decoration:none;font-size:.9rem;">Log In →</a>
</nav>

<div class="main">
  <div class="card">
    <h2>Create Account</h2>
    <p class="sub">Join free and start earning today 🚀</p>

    <div class="ref-badge" id="refBadge">🔗 Referred by: <strong id="refName"></strong></div>

    <label>Full Name</label>
    <input type="text" id="fullname" placeholder="e.g. Chukwuemeka Obi" autocomplete="name"/>

    <label>Username</label>
    <input type="text" id="username" placeholder="e.g. emeka01" autocomplete="username"/>

    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>

    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="08012345678"/>

    <label>Password</label>
    <input type="password" id="password" placeholder="Min. 6 characters"/>

    <button class="btn" id="registerBtn" onclick="registerUser()">
      <span id="btnText">Create My Account</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="msg" id="msg"></div>

    <div class="terms">
      By registering, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>

    <div class="switch">Already have an account? <a href="login.html">Log In</a></div>
  </div>
</div>

<!-- Firebase SDKs (v9 compat) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  // Read referral from URL
  const ref = new URLSearchParams(window.location.search).get("ref");
  if (ref) {
    document.getElementById("refBadge").style.display = "block";
    document.getElementById("refName").textContent = ref;
  }

  function showMsg(text, type) {
    const el = document.getElementById("msg");
    el.textContent = text;
    el.className = "msg " + type;
    el.style.display = "block";
  }

  function setLoading(loading) {
    const btn = document.getElementById("registerBtn");
    const txt = document.getElementById("btnText");
    const spin = document.getElementById("spinner");
    btn.disabled = loading;
    txt.style.display = loading ? "none" : "block";
    spin.style.display = loading ? "block" : "none";
  }

  async function registerUser() {
    const fullname = document.getElementById("fullname").value.trim();
    const username = document.getElementById("username").value.trim().toLowerCase();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;

    if (!fullname || !username || !email || !phone || !password) {
      return showMsg("Please fill in all fields.", "error");
    }
    if (password.length < 6) {
      return showMsg("Password must be at least 6 characters.", "error");
    }
    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
      return showMsg("Username: 3–20 chars, letters/numbers/underscore only.", "error");
    }

    setLoading(true);

    try {
      // Check username taken
      const usernameSnap = await db.collection("usernames").doc(username).get();
      if (usernameSnap.exists) {
        setLoading(false);
        return showMsg("Username already taken. Try another.", "error");
      }

      // Create auth user
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;

      // Batch write user data
      const batch = db.batch();

      batch.set(db.collection("users").doc(uid), {
        uid,
        fullname,
        username,
        email,
        phone,
        balance: 0,
        totalEarned: 0,
        referralCount: 0,
        referredBy: ref || null,
        joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
        status: "active"
      });

      // Reserve username
      batch.set(db.collection("usernames").doc(username), { uid });

      await batch.commit();

      // Credit referrer ₦200 bonus
      if (ref) {
        const refSnap = await db.collection("usernames").doc(ref).get();
        if (refSnap.exists) {
          const refUid = refSnap.data().uid;
          await db.collection("users").doc(refUid).update({
            balance: firebase.firestore.FieldValue.increment(200),
            totalEarned: firebase.firestore.FieldValue.increment(200),
            referralCount: firebase.firestore.FieldValue.increment(1)
          });
          // Log transaction
          await db.collection("transactions").add({
            uid: refUid,
            type: "referral_bonus",
            amount: 200,
            description: `Referral bonus for inviting ${username}`,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }

      showMsg("Account created! Redirecting to dashboard…", "success");
      setTimeout(() => window.location.href = "dashboard.html", 1800);

    } catch (err) {
      setLoading(false);
      const msgs = {
        "auth/email-already-in-use": "Email already registered. Try logging in.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/weak-password": "Password too weak. Use at least 6 characters."
      };
      showMsg(msgs[err.code] || err.message, "error");
    }
  }
</script>
</body>
</html>
